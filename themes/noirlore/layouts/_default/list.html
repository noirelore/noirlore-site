{{ define "main" }}
<section class="list-page">
  <h1 class="page-title">{{ .Title }}</h1>
  {{ with .Description }}<p class="page-description">{{ . }}</p>{{ end }}
  {{ if .Pages }}
  <div class="card-grid">
    {{ range .Pages }}
    {{ partial "card.html" . }}
    {{ end }}
  </div>
  {{ else }}
  <p class="empty-section">Nothing here yet. The first case is being written.</p>
  {{ end }}
</section>
{{ end }}
